name: Release

# Push a tag like v0.1.0 to cut a release with cross-platform binaries.
on:
  push:
    tags: ["v*"]

# Least privilege by default; only the publishing job is granted write below.
permissions:
  contents: read

jobs:
  # Stage 1: build every target in parallel and upload each binary as an
  # artifact. No job touches the GitHub release here, so there is no race.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="nanoj-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="$out.exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$out" .
      - uses: actions/upload-artifact@v4
        with:
          name: nanoj-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # Stage 2: gather all binaries and create the release in a single step, so
  # exactly one job writes the release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
